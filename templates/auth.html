<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Add New Cafe Item</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
        <!-- <script src="/static/script.js"></script> -->

        <link rel="stylesheet" href="/static/app.css"> 

    </head>
    <body>
        
        <div id="lottie-background"></div>

        <div class="logo-container">
            <img src="/static/logo.png" alt="NUST Logo">
        </div>
        
        <div class="container">
            <h2 class="form-header">Login</h2>
            
            <form id="productForm" method="post" action="/admin/auth" enctype="application/x-www-form-urlencoded">
                <div class="form-group">
                    <label for="productName">Username:</label>
                    <input type="text" id="productName" name="username" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="productPrice">Password:</label>
                    <input type="password" id="productPrice" name="password" required placeholder="Enter your password">
                </div>

                <button type="enter">Login</button>
            </form>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                lottie.loadAnimation({
                    container: document.getElementById('lottie-background'),
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: '/static/Cafe.json' 
                });
            });
        </script>
    </body>
</html>
